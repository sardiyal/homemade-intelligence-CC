# =============================================================================
# Ruff — Python linter & formatter configuration
# https://docs.astral.sh/ruff/
# =============================================================================

target-version = "py311"
line-length = 120

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line too long — handled by formatter
    "B008", # FastAPI Depends() in function defaults is the standard DI pattern
]

[lint.per-file-ignores]
# prompts.py contains intentional Traditional Chinese fullwidth punctuation in
# prompt strings (，（）：etc.) — suppress ambiguous-unicode-character warnings.
"backend/agent/prompts.py" = ["RUF001", "RUF002"]

[lint.isort]
known-first-party = ["homemade_intelligence"]

[format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
