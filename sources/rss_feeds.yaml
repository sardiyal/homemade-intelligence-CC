# =============================================================================
# Homemade Intelligence — Source Registry
# =============================================================================
# Fields:
#   name:             Display name
#   url:              RSS/Atom feed URL
#   type:             rss / gdelt / manual / api
#   layer:            Intelligence stack layer 1-10
#   bias_label:       SOCIAL/POLITICAL bias only (independent of economic stance)
#                     center / left / center-left / right / center-right /
#                     state-affiliated / independent
#   language:         ISO 639-1 code
#   is_active:        true / false
#   economic_school:  Theoretical framework (HOW the source reasons about economics)
#                     neoclassical / keynesian / monetarist / supply-side /
#                     austrian / institutional / heterodox / empirical / mixed
#                     (omit for non-economics sources)
#   economic_bias:    Economic POLICY direction (WHAT policies the source favors)
#                     progressive     = favors government intervention, redistribution, regulation
#                     center          = technocratic / pragmatic / data-driven; no systematic lean
#                     market-oriented = favors free markets, deregulation, low taxes
#                     state-directed  = state-capitalist systems (China, Russia, Gulf states);
#                                       orthogonal to the progressive/market-oriented axis
#   salience_domains: list of domains where this source is most authoritative
#                     values: geopolitics / markets / energy / taiwan / general
#   analytical_framework: IR/geopolitical theory framework the source argues from
#                     realist        = power, national interest, balance of power (Waltz, Mearsheimer)
#                     liberal        = institutions, norms, interdependence (Keohane, Ikenberry)
#                     constructivist = ideas, identities, social construction (Wendt, Finnemore)
#                     critical       = power structures, post-colonialism, hegemony critique
#                     empirical      = data-driven; no dominant IR theory
#                     mixed          = deliberately pluralist; multiple frameworks
#                     (omit for news outlets without a systematic analytical stance)
#
# NOTE: bias_label and economic_bias are INDEPENDENT dimensions. A source can be
# socially centrist but economically market-oriented (e.g. FT, The Economist),
# or socially left but economically progressive (e.g. Guardian), or socially
# independent/libertarian but economically market-oriented (e.g. Cato Institute).
# analytical_framework is a THIRD independent dimension tracking IR/geopolitical
# theory stance; applies primarily to think tanks and policy institutes.
# =============================================================================

feeds:
  # ---------------------------------------------------------------------------
  # Layer I — Geopolitics & Strategic Affairs (think tanks, journals)
  # ---------------------------------------------------------------------------
  - name: "Foreign Affairs"
    url: "https://www.foreignaffairs.com/rss.xml"
    type: rss
    layer: 1
    bias_label: center
    economic_bias: center
    analytical_framework: liberal  # CFR = quintessential liberal internationalism; multilateral order, US-led institutions
    language: en
    is_active: true
    salience_domains: [geopolitics]

  - name: "War on the Rocks"
    url: "https://warontherocks.com/feed/"
    type: rss
    layer: 1
    bias_label: center
    economic_bias: center
    analytical_framework: realist  # security studies focus; power politics, military strategy, deterrence
    language: en
    is_active: true
    salience_domains: [geopolitics]

  - name: "Lawfare"
    url: "https://www.lawfaremedia.org/feed"
    type: rss
    layer: 1
    bias_label: center        # rule-of-law focus; critical of executive overreach across parties
    economic_bias: center
    analytical_framework: liberal  # international law, rule of law, institutional norms
    language: en
    is_active: true
    salience_domains: [geopolitics]

  - name: "ISW (Institute for the Study of War)"
